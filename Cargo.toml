[package]
name = "slint-terminal"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "deny"
perf = "deny"
style = "deny"

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "raw-window-handle-06",
    "renderer-femtovg-wgpu",
    "std",
    "unstable-wgpu-29",
] }
alacritty_terminal = "0.26.0"
arboard = { version = "3.6.1", default-features = false }
bytemuck = { version = "1.23", features = ["derive"] }
glyphon = "0.11.0"
fontdb = "0.23.0"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[build-dependencies]
slint-build = "=1.17.1"
